name: Build GameGuard APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3

      - name: Extract GameGuard
        run: |
          unzip -q GameGuard-Project.zip -d project

      - name: Build APK
        run: gradle -p project --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GameGuard-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
